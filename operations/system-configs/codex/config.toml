model = "gpt-5.4-mini"
model_reasoning_effort = "low"
personality = "pragmatic"
# Full-access mode removes harness approval prompts for normal work.
# Judgment is still constrained by the shared policy in `brain/ai/policy/guardrails.md`.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[mcp_servers.stitch]
command = "npx"
args = ["-y", "@_davideast/stitch-mcp", "proxy", "--transport", "stdio"]

[mcp_servers.stitch.env]
DOTENV_CONFIG_QUIET = "true"
STITCH_API_KEY = "gcloud-adc"

[features]
multi_agent = true

[plugins."canva@openai-curated"]
enabled = true

[plugins."stripe@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."vercel@openai-curated"]
enabled = false

[projects."/Users/Office/Repos/stevewesthoek/brain"]
trust_level = "trusted"

[projects."/Users/Office/Repos/prochattools/waas/accountant"]
trust_level = "trusted"

[projects."/Users/Office/Repos/prochattools/saas/proofly"]
trust_level = "trusted"

[projects."/Users/Office/Repos/prochattools/web/says-the-bible"]
trust_level = "trusted"

[projects."/Users/Office/Repos/yeshuaacademy/web/openfund"]
trust_level = "trusted"

[projects."/Users/Office/Repos/stevewesthoek/Brain"]
trust_level = "trusted"

[projects."/Users/Office/Repos/prochattools/web/prochat"]
trust_level = "trusted"

[projects."/Users/Office/Repos/prochattools/clients/jc-citadel/jpv-bootcamp"]
trust_level = "trusted"

[projects."/Users/Office/Repos/prochattools/clients/via-di-eden"]
trust_level = "trusted"
