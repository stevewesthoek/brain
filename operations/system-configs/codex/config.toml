model = "gpt-5.4"
model_reasoning_effort = "high"
personality = "pragmatic"

[mcp_servers.notebooklm]
command = "/Users/Office/.local/bin/notebooklm-mcp"

[mcp_servers.stitch]
command = "npx"
args = ["-y", "@_davideast/stitch-mcp", "proxy", "--transport", "stdio"]

[mcp_servers.stitch.env]
DOTENV_CONFIG_QUIET = "true"
STITCH_API_KEY = "gcloud-adc"

[features]
multi_agent = true

[plugins."canva@openai-curated"]
enabled = true

[plugins."stripe@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[projects."/Users/Office/Repos/stevewesthoek/brain"]
trust_level = "trusted"
