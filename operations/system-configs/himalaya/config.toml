# Himalaya email client configuration
# Password is stored in macOS Keychain — never in this file.
# Keychain entry: service=himalaya, account=westhoek@hotmail.com

[accounts.hotmail]
email = "westhoek@hotmail.com"
display-name = "Steve Westhoek"
default = true

[accounts.hotmail.backend]
type = "imap"
host = "outlook.office365.com"
port = 993
encryption.type = "tls"
login = "westhoek@hotmail.com"

[accounts.hotmail.backend.auth]
type = "password"
cmd = "security find-generic-password -a 'westhoek@hotmail.com' -s 'himalaya' -w"

[accounts.hotmail.message.send]
backend.type = "smtp"
backend.host = "smtp-mail.outlook.com"
backend.port = 587
backend.encryption.type = "start-tls"
backend.login = "westhoek@hotmail.com"

[accounts.hotmail.message.send.backend.auth]
type = "password"
cmd = "security find-generic-password -a 'westhoek@hotmail.com' -s 'himalaya' -w"
