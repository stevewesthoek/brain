[program:google-ads-http-server]
# Google Ads n8n HTTP callback server
# Runs on localhost:8001 and handles webhook callbacks from n8n workflows

directory=/Users/Office/Repos/stevewesthoek/brain
command=python3 /Users/Office/Repos/stevewesthoek/brain/tools/google-ads/http_server.py --port 8001 --host localhost
autostart=true
autorestart=true
stderr_logfile=/Users/Office/Repos/stevewesthoek/brain/data/google-ads/logs/http_server_error.log
stdout_logfile=/Users/Office/Repos/stevewesthoek/brain/data/google-ads/logs/http_server_access.log
user=Office
environment=PATH="/Users/Office/.local/bin:/usr/local/bin:/usr/bin"
