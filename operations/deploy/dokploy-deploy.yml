# Minimal Dokploy trigger — use ONLY for apps where Dokploy builds the image itself (sourceType: github).
#
# For Next.js / Node apps that build on GitHub and push to GHCR, use dokploy-image-deploy.yml instead.
# That template is the standard for all prochattools/yeshuaacademy repos.
#
# Required GitHub secrets:
#   DOKPLOY_API_KEY   — generate in Dokploy dashboard → Settings → API
#   DOKPLOY_APP_ID    — found in app settings URL in the Dokploy dashboard

name: Deploy to Dokploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy deployment
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://dokploy.prochat.tools/api/application.deploy \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\"}")

          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "Deployment trigger failed with status $RESPONSE"
            exit 1
          fi

          echo "Deployment triggered successfully."
