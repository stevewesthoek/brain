<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45B7D1;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#12849e;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="white" opacity="0.85" />

  <!-- Border -->
  <rect x="2" y="2" width="1276" height="716" fill="none" stroke="#45B7D1" stroke-width="4" />

  <!-- Content area -->
  <g transform="translate(40, 40)">
    <!-- Color bar -->
    <rect width="8" height="640" fill="#45B7D1" />

    <!-- Main content (offset from color bar) -->
    <g transform="translate(24, 0)">
      <!-- Scene number and duration -->
      <text x="0" y="40" font-size="36" font-weight="bold" fill="#12849e" font-family="Arial, sans-serif">
        Scene 2 · 20s
      </text>

      <!-- Visual prompt heading -->
      <text x="0" y="90" font-size="16" font-weight="bold" fill="#333" font-family="Arial, sans-serif">
        Visual
      </text>

      <!-- Visual prompt text (wrapped) -->
      <g id="visualPrompt">
        <text x="0" y="110" font-size="14" fill="#555" font-family="Arial, sans-serif">Make a short video about a tree. — scene 2 of 3</text>
      </g>

      <!-- Narration heading -->
      <text x="0" y="340" font-size="16" font-weight="bold" fill="#333" font-family="Arial, sans-serif">
        Narration
      </text>

      <!-- Narration text (wrapped) -->
      <g id="narrationText">
        <text x="0" y="360" font-size="13" fill="#666" font-family="Arial, sans-serif">Scene 2</text>
      </g>

      <!-- On-screen text if provided -->
      
        <!-- On-screen text heading -->
        <text x="0" y="600" font-size="16" font-weight="bold" fill="#333" font-family="Arial, sans-serif">
          On-Screen
        </text>
        <!-- On-screen text -->
        <text x="0" y="620" font-size="13" fill="#666" font-family="Arial, sans-serif">Scene 2</text>
      

      <!-- Footer -->
      <text x="0" y="630" font-size="12" fill="#999" font-family="Arial, sans-serif">
        Deterministic placeholder • 2026-06-05
      </text>
    </g>
  </g>
</svg>