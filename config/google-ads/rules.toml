[automation]
default_mode = "safe"
allow_structural_auto_apply = false
allow_new_campaign_auto_create = false
allow_new_ad_group_auto_create = false
allow_new_keyword_theme_auto_apply = false

[safe_auto_apply]
negative_keywords = true
labels = true
broken_url_flagging = true
low_risk_recommendation_whitelist = true

[quality]
require_two_active_ads_per_ad_group = true
require_landing_page_for_new_keywords = true
require_mission_alignment = true

[compliance]
watch_official_sources = true
open_report_when_sources_change = true

[negative_keywords]
spend_threshold_usd = 20.0
lookback_days = 30
match_type = "BROAD"

[approval_gates]
# Auto-approve recommendations with HIGH priority and impact > threshold
auto_approve_high_impact = true
high_impact_threshold_usd = 500.0

# Require manual approval for medium/low priority
require_manual_medium = true
require_manual_low = true

# Budget-aware approval: hold mutations if pacing poorly
enable_budget_checks = true
min_pacing_pct_for_approval = 80.0  # Don't approve if we're < 80% of target (underspending)
max_pacing_pct_for_approval = 120.0 # Don't approve if we're > 120% of target (overspending)

# Campaign type conditions: different approval thresholds per campaign type
[approval_gates.campaign_types]
SEARCH = { min_impact = 300.0, max_daily_spend = 150.0 }
DISPLAY = { min_impact = 200.0, max_daily_spend = 100.0 }
VIDEO = { min_impact = 400.0, max_daily_spend = 200.0 }
